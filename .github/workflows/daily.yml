# Weekday-morning refresh: AMFI publishes NAVs late at night and some AMCs only the next morning,
# so this runs at 08:45 IST (03:15 UTC), Tuesday-Saturday, i.e. after each trading day.
# Updates NAVs, index data, returns and period ranks. Overall tiers stay as set by the monthly run.
name: Daily NAV refresh
on:
  schedule:
    - cron: "15 3 * * 2-6"
  workflow_dispatch:
    inputs:
      history:
        description: "Also fill and update the monthly rating history"
        type: boolean
        default: false
      fresh_tiers:
        description: "Re-rate Overall tiers today (model changes on staging)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: { group: data-refresh, cancel-in-progress: false }
env:
  AETERNA_EQUITY_MODEL: v8   # tested on the live engine (audit/validate_live.py); set v3 here to return to the old ratings
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 30 }   # enough history to rebase onto commits pushed during the run
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python run_monthly.py --daily ${{ inputs.fresh_tiers && '--fresh-tiers' || '' }} ${{ inputs.history && '--history' || '' }}
      - run: python site/build_data.py && python site/build_series.py && python site/build_site.py
      - name: Health check
        run: |
          python - <<'PY'
          import pandas as p, json
          d=p.read_csv('outputs/latest/rankings.csv')
          assert len(d)>1500, 'too few funds'
          h=json.load(open('site/data/holdings.json'))
          assert len(h)>=450, f'holdings coverage too low: {len(h)} funds'
          print('ok', len(d), 'funds,', len(h), 'with holdings')
          PY
      - name: Commit refreshed data
        run: |
          git config user.name "aeterna-bot"; git config user.email "actions@users.noreply.github.com"
          git add outputs/latest data/raw site/data site/dist && (git add outputs/rating_history.csv.gz 2>/dev/null || true) && git commit -m "Daily NAV refresh $(date -u +%F)" || echo "nothing to commit"
          # main may have moved during the run (code pushes, the office-PC upload): rebase our data commit onto it
          for i in 1 2 3; do git push && exit 0; git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }; done
          echo "push failed 3 times"; exit 1
