# Publishes the website to Cloudflare Pages (project "aeterna-wealth").
# Protocol: website changes are pushed to the `staging` branch first -> https://staging.aeterna-wealth.pages.dev
# (a Cloudflare preview, not indexed). After the owner approves, staging is merged into main -> the live site.
# After each daily / monthly data run, the branch it ran on is published again (their data commits are pushed by the
# workflow token, which does not trigger push events); a manual run publishes the branch it is started on.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit). Without it the job is skipped.
name: Deploy website
on:
  push:
    branches: [main, staging]
  workflow_run:
    workflows: ["Daily NAV refresh", "Monthly ratings"]
    types: [completed]
  workflow_dispatch: {}
concurrency: { group: "deploy-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}", cancel-in-progress: true }
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      TARGET: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.TARGET }}" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Build the static site
        run: python site/build_site.py
      - name: Upload to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f5933230e8e718e0702500f52aa945cf
          command: pages deploy site/dist --project-name aeterna-wealth --branch ${{ env.TARGET }} --commit-dirty=true
      - name: Tell search engines what changed (IndexNow; live site only, after launch)
        if: env.HAS_TOKEN == 'true' && env.TARGET == 'main' && hashFiles('site/LAUNCHED') != ''
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, re, urllib.request
          key = re.search(r'INDEXNOW_KEY = "([0-9a-f]+)"', open("site/build_site.py").read()).group(1)
          urls = re.findall(r"<loc>([^<]+)</loc>", open("site/dist/sitemap.xml").read())[:10000]
          body = json.dumps({"host": "aeternawealth.com", "key": key, "keyLocation": f"https://aeternawealth.com/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          print("IndexNow:", urllib.request.urlopen(req, timeout=30).status, len(urls), "URLs")
          PY
      - name: No Cloudflare token yet
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret not set; site built but not published"
