# Monthly full run on the 12th at 09:20 IST (03:50 UTC): new AMC portfolios (due by the 10th),
# expense ratios, AUM, market-cap list, full re-rating (Overall tiers), dashboard.
name: Monthly ratings
on:
  schedule:
    - cron: "50 3 12 * *"
  workflow_dispatch: {}
jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python run_monthly.py
      - run: python site/build_data.py && python site/build_site.py
      - name: Health check
        run: |
          python - <<'PY'
          import pandas as p, glob
          d=p.read_csv('outputs/latest/rankings.csv')
          assert len(d)>1500, 'too few funds'
          assert d.tier.ne('Unrated').sum()>1000, 'too few rated funds'
          print('ok', len(d))
          PY
      - name: Commit results
        run: |
          git config user.name "aeterna-bot"; git config user.email "actions@users.noreply.github.com"
          git add outputs data site/data site/dist && git commit -m "Monthly ratings $(date -u +%F)" || echo "nothing to commit"
          git push
