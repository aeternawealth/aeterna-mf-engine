# Monthly full run on the 11th and 16th at 14:50 IST (09:20 UTC): new AMC portfolios (due by the 10th; the 16th
# picks up late publishers), expense ratios, AUM, market-cap list, full re-rating (Overall tiers), dashboard.
# The office PC uploads blocked AMCs at 10:30 IST on the same days (tools/pc_download.py), before these runs.
name: Monthly ratings
on:
  schedule:
    - cron: "20 9 11,16 * *"
  workflow_dispatch:
    inputs:
      holdings_month:
        description: "Holdings month YYYY-MM (blank = previous calendar month)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: { group: data-refresh, cancel-in-progress: false }
jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 30 }   # enough history to rebase onto commits pushed during the run
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Run engine
        env: { HMONTH: "${{ inputs.holdings_month }}" }
        run: python run_monthly.py ${HMONTH:+--holdings-month "$HMONTH"}
      - run: python site/build_data.py && python site/build_series.py && python site/build_site.py
      - name: Health check
        run: |
          python - <<'PY'
          import pandas as p, glob
          d=p.read_csv('outputs/latest/rankings.csv')
          assert len(d)>1500, 'too few funds'
          assert d.tier.ne('Unrated').sum()>1000, 'too few rated funds'
          import json
          h=json.load(open('site/data/holdings.json')); m=json.load(open('site/data/meta.json'))
          assert m.get('holdings_month'), 'no holdings month on the site'
          assert len(h)>=450, f'holdings coverage too low: {len(h)} funds'
          print('ok', len(d), 'funds,', len(h), 'with holdings, month', m['holdings_month'])
          PY
      - name: Commit results
        run: |
          git config user.name "aeterna-bot"; git config user.email "actions@users.noreply.github.com"
          git add outputs data site/data site/dist && git commit -m "Monthly ratings $(date -u +%F)" || echo "nothing to commit"
          # main may have moved during the run (code pushes, the office-PC upload): rebase our data commit onto it
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin main || { git rebase --abort; exit 1; }; done
          echo "push failed 3 times"; exit 1
