# Monthly PMS refresh: on the 20th (APMI has the previous month by then), retried each day to the 28th until the
# month appears. Commits the new data to the branch it runs on; the Deploy website workflow then publishes it.
name: PMS monthly refresh
on:
  schedule:
    - cron: "35 4 20-28 * *"   # 10:05 IST
  workflow_dispatch:
    inputs:
      month:
        description: "Month to load (YYYY-MM); empty = last month"
        required: false
        default: ""
permissions:
  contents: write
concurrency: { group: pms-monthly, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Refresh
        id: r
        run: python tools/pms_update.py ${{ inputs.month }}
      - name: Commit
        if: steps.r.outputs.updated == '1'
        run: |
          git config user.name "aeterna-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/pms/apmi_monthly.csv data/pms/bench_monthly.csv site/data/pms.json outputs/latest/pms_changes.md
          git commit -qm "PMS refresh: APMI data to $(python -c "import json;print(json.load(open('site/data/pms.json'))['as_of'])")"
          git push
