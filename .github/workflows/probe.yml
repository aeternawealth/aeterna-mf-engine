# Manual tool: inspect AMC portfolio pages from GitHub's servers (used to build direct download adapters).
# Results are pushed to the `probe-results` branch; nothing on main changes.
name: Probe AMC pages
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated page URLs (optional)"
        required: false
        default: ""
      download:
        description: "Optional downloader test, e.g. '2026-09 Motilal,PGIM' (month, then AMC name parts)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Probe
        env: { URLS: "${{ inputs.urls }}" }
        run: |
          mkdir -p /tmp/probe
          if [ -n "$URLS" ]; then python tools/probe_amc.py /tmp/probe $URLS; fi
      - name: Downloader test
        if: ${{ inputs.download != '' }}
        env: { DL: "${{ inputs.download }}" }
        run: |
          set -- $DL
          python -m engine.amc_downloader --month "$1" --only "$2" | tee /tmp/probe/download_stdout.txt || true
          cp "data/holdings/$1/_download_log.csv" /tmp/probe/download_log.csv || true
          find "data/holdings/$1" -type f -printf "%s %p\n" > /tmp/probe/download_files.txt
          python - "$1" <<'PY' > /tmp/probe/parse_check.txt 2>&1 || true
          import sys
          from pathlib import Path
          from engine import holdings as H
          for f in sorted(Path("data/holdings", sys.argv[1]).rglob("*")):
              if f.suffix.lower() in (".xlsx", ".xls", ".xlsm", ".xlsb"):
                  r = H.parse_file(f)
                  print(f"{f.parent.name}/{f.name}: {len(r)} portfolios, equity rows {sum(int(x[1]['is_equity'].sum()) for x in r)}")
          PY
      - name: Push results to probe-results branch
        run: |
          # results of each run replace the previous ones; pushed from a separate repo so main's tree is untouched
          R=$(git config --get remote.origin.url); H=$(git config --get http.https://github.com/.extraheader || true)
          mkdir /tmp/pr && cd /tmp/pr && git init -q && git checkout -q -b probe-results
          git config user.name "aeterna-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir probe && cp /tmp/probe/* probe/ && git add probe && git commit -qm "Probe $(date -u +%F_%H%M)"
          git -c http.https://github.com/.extraheader="$H" push -f "$R" probe-results
