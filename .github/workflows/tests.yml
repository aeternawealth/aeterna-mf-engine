# Calculator maths tests and the allocation planner stress test (3,000 investors, calibration, real-history backtest).
name: Tests
on:
  push:
    paths: ["site/app.html", "site/planner/**", "tests/**", "tools/planner_swr.mjs", ".github/workflows/tests.yml"]
  workflow_dispatch: {}
jobs:
  calculators:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20" }
      - run: node tests/calculators.test.mjs
      - run: node tests/planner.test.mjs
